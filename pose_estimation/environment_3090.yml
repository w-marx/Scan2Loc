name: pred_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
    - torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu121
    - torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cu121
    - numpy
    - opencv-python
    - scikit-learn
    - open3d
    - uv
    - torch-ransac3d
    - scikit-image
    - pypose
    - einops
    - tyro
    - transformers