[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headset-localization"
version = "0.1.0"
description = "Headset localization with inference & evaluation in robot scanned environments"
requires-python = ">=3.12"

dependencies = []


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]